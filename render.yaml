services:
  # 1. Automation worker. Runs the execution engine and the performance scanner.
  - type: web
    name: degenaration-worker
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # NOT hardcoded, and this line is load-bearing.
      #
      # It read `value: devnet`. Production's readiness check requires
      # `worker.network === "mainnet"`, so a perfectly deployed worker would have reported
      # devnet and failed `workerHealth` forever — a green service that the app correctly
      # refuses to trust, which is the most expensive kind of wrong.
      #
      # Set it in the dashboard: `devnet` while you verify, `mainnet` when you mean it.
      - key: WORKER_NET
        sync: false
      # Watch-only until signing is deliberately enabled. Leave "off" for the first deploy:
      # bring the service up, confirm it heartbeats, then flip it.
      - key: DELEGATED_SIGNING
        value: "off"
      - key: COPY_TRADING
        value: "off"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MAINNET_RPC
        sync: false
      # Read by server/engine/rugcheck.js and safety.js as the RPC fallback.
      - key: SOLANA_RPC_URL
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_AUTHORIZATION_KEY
        sync: false
      # Until this is set, configuredPlatformFeeBps() returns 0 and NO fee is collected.
      - key: PLATFORM_FEE_ACCOUNT
        sync: false
      # Shared secret for engine <-> site calls (server/engine/index.js).
      - key: BOT_SHARED_SECRET
        sync: false

  # 2. Discord gateway bot. Previously ABSENT from this file, which is why it has never
  #    run as a managed service — and therefore why raw_signals is empty and the two
  #    approved sources show no measured performance. It is a separate program with its
  #    own package.json (discord.js), so it needs its own service and its own rootDir.
  #
  #    Render's free tier only supports web services. The bot already exposes a secret-free
  #    /health endpoint, so running it as a web service preserves the Gateway process while
  #    keeping this deployment free and independently observable.
  - type: web
    name: degenaration-discord-bot
    runtime: node
    plan: free
    rootDir: server/bot
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # Without this the bot cannot connect to Discord at all.
      - key: DISCORD_BOT_TOKEN
        sync: false
      # Where parsed calls are posted. Without it, nothing is ever ingested.
      - key: INGEST_URL
        sync: false
      # Authenticates bot -> site requests (server/bot/store.js).
      - key: BOT_SHARED_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: BOT_REGISTER_URL
        sync: false
      - key: BOT_APPROVED_CHANNELS_URL
        sync: false
      - key: BOT_GUILD_STATUS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Optional. Approved-channel refresh interval; defaults in code when unset.
      - key: CHANNELS_REFRESH_MS
        sync: false
      # Optional global scanner acknowledgment switch. Defaults on; set to off to disable.
      - key: SCANNER_ACKNOWLEDGMENTS
        sync: false
      # Optional relay/notification targets.
      - key: RELAY_CHANNEL_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_BUILD
        sync: false
      - key: HISTORY_BACKFILL_ENABLED
        value: "on"
