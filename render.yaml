services:
  - type: web
    name: degenaration-worker
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # These three decide whether real client SOL moves, so the live service owns them,
      # not this file. A blueprint sync re-applies any literal `value:` here, which would
      # silently switch a trading worker back to devnet and watch-only. `sync: false`
      # leaves the dashboard value untouched.
      - key: WORKER_NET
        sync: false
      - key: DELEGATED_SIGNING
        sync: false
      - key: COPY_TRADING
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MAINNET_RPC
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_AUTHORIZATION_KEY
        sync: false
      - key: PLATFORM_FEE_ACCOUNT
        sync: false
      # Authenticates the site's POST /dispatch push (same secret the bot uses).
      - key: BOT_SHARED_SECRET
        sync: false

  - type: worker
    name: degenaration-discord-bot
    runtime: node
    plan: free
    rootDir: server/bot
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: INGEST_URL
        sync: false
      - key: BOT_SHARED_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: RELAY_CHANNEL_ID
        sync: false
      - key: CHANNELS_REFRESH_MS
        value: "30000"
